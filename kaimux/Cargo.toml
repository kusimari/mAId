[package]
name = "kaimux"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "kaimux"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Tmp-file + rename atomic writes — replaces a hand-rolled write_atomic.
atomicwrites = "0.4"
clap = { version = "4", features = ["derive"] }
# fd-lock over fs2 — fs2 is unmaintained (RUSTSEC) and its lock_exclusive
# trait method shadows std File's stabilized inherent method on Rust 1.89+,
# tripping unstable_name_collisions which `cargo clippy -D warnings` then
# fails on.
fd-lock = "4"
nix = { version = "0.29", features = ["signal", "process"] }
notify = "8"
notify-debouncer-mini = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
