[package]
name = "build-tool"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "build-tool"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Scratch workdirs for behavioral tests + reply capture files.
tempfile = "3"
clap = { version = "4", features = ["derive"] }
gray_matter = "0.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
