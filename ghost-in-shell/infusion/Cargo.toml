[package]
name = "infusion"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
ghost = { path = "../ghost" }
globset = "0.4"
gray_matter = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
