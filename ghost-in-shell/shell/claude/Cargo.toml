[package]
name = "shell-claude"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ghost-claude"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ghost = { path = "../../ghost" }
infusion = { path = "../../infusion" }
# The plain installer, as a library: Claude Code's config dir, and the
# install the ghost runs when mAId's resources are not there.
plain = { path = "../../../plain" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# The reuse check stages plain into a scratch dir.
tempfile = "3"

