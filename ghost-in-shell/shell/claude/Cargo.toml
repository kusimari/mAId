[package]
name = "shell-claude"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "maid-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ghost = { path = "../../ghost" }
infusion = { path = "../../infusion" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
